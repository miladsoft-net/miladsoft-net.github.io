name: Add Repository Access

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
        type: string
      repositories:
        description: 'Comma-separated list of repositories'
        required: true
        type: string

jobs:
  add-collaborator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Add collaborator to repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra REPOS <<< "${{ github.event.inputs.repositories }}"
          for repo in "${REPOS[@]}"; do
            repo=$(echo $repo | xargs)
            echo "Processing repository: $repo"
            
            response=$(curl -s -w "%{http_code}" -o response.txt \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/miladsoft-net/$repo/collaborators/${{ github.event.inputs.username }}" \
              -d '{"permission":"pull"}')
            
            if [ "$response" = "201" ] || [ "$response" = "204" ]; then
              echo "✓ Successfully added read access to $repo"
            else
              echo "✗ Failed to add access to $repo (Status: $response)"
              cat response.txt
              exit 1
            fi
          done
