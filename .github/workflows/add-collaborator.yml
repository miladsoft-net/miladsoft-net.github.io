name: Add Collaborator to Repos

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
        type: string
      repositories:
        description: 'Comma-separated list of repositories'
        required: true
        type: string

jobs:
  add-collaborator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Add collaborator to repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra REPOS <<< "${{ github.event.inputs.repositories }}"
          for repo in "${REPOS[@]}"; do
            repo=$(echo $repo | xargs) # Trim whitespace
            echo "Adding collaborator to $repo"
            curl -X PUT \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/miladsoft-net/$repo/collaborators/${{ github.event.inputs.username }}" \
              -d '{"permission":"push"}'
          done
