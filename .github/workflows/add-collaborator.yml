name: Add Repository Access

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub Username'
        required: true
        type: string
      repositories:
        description: 'Repository names (comma-separated)'
        required: true
        type: string

jobs:
  add-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add repository access
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          IFS=',' read -ra REPOS <<< "${{ github.event.inputs.repositories }}"
          for repo in "${REPOS[@]}"; do
            repo=$(echo $repo | xargs)
            echo "Processing repository: $repo"
            
            # Add collaborator with read access
            status_code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/miladsoft-net/$repo/collaborators/${{ github.event.inputs.username }}" \
              -d '{"permission":"pull"}')
            
            if [ "$status_code" = "201" ] || [ "$status_code" = "204" ]; then
              echo "✓ Successfully added read access to $repo"
            else
              echo "✗ Failed to add access to $repo (Status: $status_code)"
              exit 1
            fi
          done

      - name: Send notification
        if: always()
        run: |
          echo "::set-output name=status::${{ job.status }}"
          echo "::set-output name=username::${{ github.event.inputs.username }}"
          echo "::set-output name=repositories::${{ github.event.inputs.repositories }}"
